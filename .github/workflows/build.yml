name: build

# 构建仅由主动操作触发：
#   1) 推送 main 且改动命中下面 paths 中的文件
#   2) 手动执行 Run workflow
# 不监听上游发版，无定时任务；版本来源唯一为 versions.env。

on:
  workflow_dispatch:
    inputs:
      mosdns_version:
        description: "临时指定 mosdns 版本（留空则用 versions.env，仅本次生效）"
        required: false
        default: ""
      push_latest:
        description: "是否更新 latest 标签"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "scheduler/**"
      - "ui/**"
      - "config/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "versions.env"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

env:
  MV: ${{ github.event.inputs.mosdns_version || '' }}
  PUSH_LATEST: ${{ github.event.inputs.push_latest || 'true' }}
  DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 1. 读版本（只来自 versions.env，可被手动输入临时覆盖）----------
      - id: ver
        name: 解析版本
        run: |
          set -uo pipefail
          set -a; . ./versions.env; set +a
          MOSDNS="${MOSDNS_VERSION}"; CFT="${CFT_VERSION}"; GT="${GT_VERSION}"
          GOLANG="${GOLANG_IMAGE}"; ALPINE="${ALPINE_IMAGE}"
          [ -n "$MV" ] && MOSDNS="$MV"

          echo "mosdns=$MOSDNS"   >> "$GITHUB_OUTPUT"
          echo "cft=$CFT"         >> "$GITHUB_OUTPUT"
          echo "gt=$GT"           >> "$GITHUB_OUTPUT"
          echo "golang=$GOLANG"   >> "$GITHUB_OUTPUT"
          echo "alpine=$ALPINE"   >> "$GITHUB_OUTPUT"
          SAFE=$(echo "$MOSDNS" | tr '/ :' '---')
          echo "tag=${SAFE}-$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "本次使用: mosdns=$MOSDNS cft=$CFT gt=$GT golang=$GOLANG alpine=$ALPINE"

      - uses: docker/setup-buildx-action@v3
        with:
          install: true

      # ---------- 2. 构建 + 自检 + 推送（失败自动回退 known-good）----------
      - name: 构建 / 自检 / 推送
        id: build
        env:
          MOSDNS: ${{ steps.ver.outputs.mosdns }}
          CFT: ${{ steps.ver.outputs.cft }}
          GT: ${{ steps.ver.outputs.gt }}
          GOLANG: ${{ steps.ver.outputs.golang }}
          ALPINE: ${{ steps.ver.outputs.alpine }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -uo pipefail
          GHCR="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mosdns"
          DOCKERHUB=""
          [ -n "${DH_USER:-}" ] && DOCKERHUB="docker.io/${DH_USER}/mosdns"
          TEST_IMAGE="mosdns:test"

          echo "== 登录 GHCR =="
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          if [ -n "${DH_USER:-}" ] && [ -n "${DH_TOKEN:-}" ]; then
            echo "== 登录 Docker Hub =="
            echo "$DH_TOKEN" | docker login docker.io -u "$DH_USER" --password-stdin || echo "warn: Docker Hub 登录失败，跳过"
          else
            echo "== 未配置 Docker Hub 凭证，仅推 GHCR =="
          fi

          build_and_test() {
            local m=$1 c=$2 g=$3 gl=$4 al=$5
            echo "== 构建 mosdns=$m cft=$c gt=$g golang=$gl alpine=$al =="
            docker buildx build --load \
              --build-arg MOSDNS_VERSION="$m" \
              --build-arg CFT_VERSION="$c" \
              --build-arg GT_VERSION="$g" \
              --build-arg GOLANG_IMAGE="$gl" \
              --build-arg ALPINE_IMAGE="$al" \
              --build-arg BUILD_REV="${GITHUB_SHA::7}" \
              --build-arg BUILD_DATE="$(date -u +%Y%m%d)" \
              -t "$TEST_IMAGE" . || { echo "构建失败"; return 1; }

            echo "== 自检门禁 =="
            docker rm -f mtest >/dev/null 2>&1 || true
            docker run -d --name mtest -p 18080:80 "$TEST_IMAGE" || { echo "启动失败"; return 1; }
            local ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then ok=1; break; fi
              if ! docker ps --filter name=mtest --filter status=running --format '{{.Names}}' | grep -q mtest; then
                echo "容器已退出"; docker logs mtest || true; break
              fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "UI 健康检查未通过"; docker logs mtest || true; docker rm -f mtest >/dev/null 2>&1 || true; return 1
            fi
            docker exec mtest mosdns version >/dev/null 2>&1 || { echo "mosdns 无法执行"; docker rm -f mtest >/dev/null 2>&1; return 1; }
            # 测速工具是「下载失败也能出包」的可选项，所以失败不会让构建挂；
            # 但不能悄悄退化——上游改了资产名就报出来，否则镜像里永远缺工具。
            if docker exec mtest sh -c 'test -x /app/bin/cft/cfst' 2>/dev/null; then
              echo "CloudflareSpeedTest 已固化: $(docker exec mtest /app/bin/cft/cfst -v 2>&1 | head -1)"
            else
              echo "::warning::CloudflareSpeedTest 未装进镜像（$c），cf 路会回退纯脚本探测"
            fi
            docker exec mtest sh -c 'test -s /data/config.yaml && test -f /data/prefs/all.hosts' \
              || { echo "配置/hosts 未生成"; docker rm -f mtest >/dev/null 2>&1; return 1; }
            docker rm -f mtest >/dev/null 2>&1 || true
            echo "自检通过"
            return 0
          }

          push_image() {
            docker tag "$TEST_IMAGE" "$GHCR:$TAG"; docker push "$GHCR:$TAG" || return 1
            if [ -n "$DOCKERHUB" ]; then
              docker tag "$TEST_IMAGE" "$DOCKERHUB:$TAG"; docker push "$DOCKERHUB:$TAG" || return 1
            fi
            if [ "$PUSH_LATEST" = "true" ]; then
              docker tag "$TEST_IMAGE" "$GHCR:latest"; docker push "$GHCR:latest" || return 1
              if [ -n "$DOCKERHUB" ]; then
                docker tag "$TEST_IMAGE" "$DOCKERHUB:latest"; docker push "$DOCKERHUB:latest" || return 1
              fi
            fi
            return 0
          }

          if build_and_test "$MOSDNS" "$CFT" "$GT" "$GOLANG" "$ALPINE"; then
            push_image || { echo "::error::推送失败"; exit 1; }
            echo "== 构建并推送成功: $GHCR:$TAG =="
            # 提示：versions.env 与 known-good.env 不一致时，把回退基准同步一下（不自动改文件）
            if [ -z "$MV" ] && ! diff -q <(grep -v '^#' versions.env | grep -v '^$') \
                                             <(grep -v '^#' known-good.env | grep -v '^$') >/dev/null 2>&1; then
              {
                echo "### 这版已通过自检，但 known-good.env 还是旧的"
                echo ""
                echo "确认线上稳定后，把 \`known-good.env\` 改成下面内容，下次构建失败的回退基准才对得上："
                echo '```'
                grep -v '^#' versions.env | grep -v '^$'
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            # 不使用旧版本兜底出包：此类镜像标签为新版本、内容为旧版本，容易误上线。
            # 直接失败并保持线上版本不变，同时输出上一份通过自检的组合作为回退参考。
            echo "::error::构建或自检未通过，本次不出包，线上保持不动"
            {
              echo "### 构建失败：本次没有推送任何镜像"
              echo ""
              echo "- 尝试组合: mosdns=$MOSDNS cft=$CFT gt=$GT golang=$GOLANG alpine=$ALPINE"
              echo "- 线上不受影响，不需要回滚"
              echo ""
              echo "如果怀疑是新版本本身的问题，把 \`versions.env\` 改回上一份可用组合（\`known-good.env\`）："
              echo '```'
              grep -v '^#' known-good.env | grep -v '^$'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ---------- 3. CVE 扫描（只报告，不阻断）----------
      - name: CVE 扫描（trivy）
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "mosdns:test"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          ignore-unfixed: true

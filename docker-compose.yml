services:
  mosdns:
    image: po9873/mosdns:latest
    container_name: mosdns
    restart: unless-stopped
    ports:
      - "53:53/udp"    # DNS
      - "53:53/tcp"    # DNS
      - "80:80"        # Web UI（PREF_UI_PORT 可改）
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      # PREF_UI_PORT: "80"       # 控制台端口，默认 80
      # PREF_DNS_PORT: "53"      # DNS 端口，默认 53
      # PREF_API_PORT: "9099"    # 内部 API，只监听环回，不用映射
    # 诊断页的 ICMP 探测需要原始套接字；Docker 默认权限已含 NET_RAW。
    # 若你的环境用了 cap_drop: ALL 或 NAS 限制了能力，解开下面两行。
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
